name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Fix Kotlin 2.x compatibility
        working-directory: simple_live_app/android
        run: |
          echo "kotlin.stdlib.default.dependency=true" >> gradle.properties

          python3 << 'PYEOF'
          import re

          path = "settings.gradle.kts"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if "jitpack" not in content:
              content = re.sub(
                  r'(mavenCentral\s*$\s*$)',
                  r'\1\n        maven { url = uri("https://jitpack.io") }',
                  content,
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Added jitpack repository")
          else:
              print("jitpack already present")
          PYEOF

          python3 << 'PYEOF'
          import re

          path = "build.gradle.kts"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          patch = """
          // --- CI auto-patch: redirect removed kotlin-stdlib-jdk7/jdk8 -> kotlin-stdlib ---
          configurations.all {
              resolutionStrategy.eachDependency {
                  if (requested.group == "org.jetbrains.kotlin" &&
                      requested.name.matches(Regex("kotlin-stdlib(-jdk7|-jdk8)?"))) {
                      useTarget("org.jetbrains.kotlin:kotlin-stdlib:${requested.version}")
                  }
              }
          }
          """

          if "CI auto-patch" not in content:
              content = content.rstrip() + "\n" + patch + "\n"
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Added kotlin stdlib redirection rule")
          else:
              print("Patch already present")
          PYEOF

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Generate signing keystore
        working-directory: simple_live_app/android
        run: |
          keytool -genkeypair -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias simplelive -storepass android -keypass android \
            -dname "CN=SimpleLive, OU=Dev, O=SimpleLive, L=Unknown, S=Unknown, C=CN"
          echo "storePassword=android" > key.properties
          echo "keyPassword=android"   >> key.properties
          echo "keyAlias=simplelive"   >> key.properties
          echo "storeFile=key.jks"     >> key.properties

      - name: Build release APK
        working-directory: simple_live_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
