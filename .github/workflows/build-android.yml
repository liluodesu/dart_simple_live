name: Build Android APK

on:
  workflow_dispatch:        # 允许在 Actions 页面手动点按钮触发
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub 的 Linux  runner 已预装 Android SDK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flutter dependencies
        working-directory: simple_live_app
        run: flutter pub get

      # 读取 Flutter 写入的 compileSdk / ndkVersion，安装对应平台与 NDK（避免版本对不上）
      - name: Install required Android SDK platform & NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          cd simple_live_app/android
          SDK_VER=$(grep -E '^flutter.compileSdkVersion=' local.properties | cut -d= -f2 | tr -d '[:space:]')
          NDK_VER=$(grep -E '^flutter.ndkVersion=' local.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "compileSdk=$SDK_VER  ndk=$NDK_VER"
          yes | sdkmanager "platforms;android-$SDK_VER" "build-tools;${SDK_VER}.0.0" "ndk;$NDK_VER"

      # 自动生成签名（release 构建强制要求 key.properties）
      - name: Generate signing keystore
        working-directory: simple_live_app/android
        run: |
          keytool -genkeypair -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias simplelive -storepass android -keypass android \
            -dname "CN=SimpleLive, OU=Dev, O=SimpleLive, L=Unknown, S=Unknown, C=CN"
          echo "storePassword=android" > key.properties
          echo "keyPassword=android"   >> key.properties
          echo "keyAlias=simplelive"   >> key.properties
          echo "storeFile=key.jks"     >> key.properties

      - name: Build release APK
        working-directory: simple_live_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
