name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Kotlin version for XPopup2 compatibility
        working-directory: simple_live_app/android
        run: |
          echo "=== Before patch ==="
          grep 'kotlin.*version' settings.gradle.kts || true
          sed -i '' 's/version "2\.1\.0"/version "1.9.22"/' settings.gradle.kts
          echo "=== After patch ==="
          grep 'kotlin.*version' settings.gradle.kts || true

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore simple_live_app/android/key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias simplelive -storepass android -keypass android \
            -dname "CN=SimpleLive, OU=Dev, O=SimpleLive, L=Unknown, S=Unknown, C=CN"
          cat > simple_live_app/android/key.properties << EOF
          storePassword=android
          keyPassword=android
          keyAlias=simplelive
          storeFile=key.jks
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build APK
        working-directory: simple_live_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
