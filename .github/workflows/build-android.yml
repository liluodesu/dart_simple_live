name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Fix Kotlin 2.x stdlib compatibility (init.gradle)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/kotlin-stdlib-fix.gradle" << 'INITEOF'
          gradle.projectsEvaluated {
              allprojects {
                  configurations.all {
                      resolutionStrategy.eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin' &&
                              details.requested.name.matches('kotlin-stdlib(-jdk7|-jdk8)?')) {
                              details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"
                              println "[init.gradle] Redirected ${details.requested.name} -> kotlin-stdlib"
                          }
                      }
                  }
              }
          }
          INITEOF
          echo "Init script written to $HOME/.gradle/init.d/kotlin-stdlib-fix.gradle"
          cat "$HOME/.gradle/init.d/kotlin-stdlib-fix.gradle"

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Generate signing keystore
        working-directory: simple_live_app/android
        run: |
          keytool -genkeypair -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias simplelive -storepass android -keypass android \
            -dname "CN=SimpleLive, OU=Dev, O=SimpleLive, L=Unknown, S=Unknown, C=CN"
          echo "storePassword=android" > key.properties
          echo "keyPassword=android"   >> key.properties
          echo "keyAlias=simplelive"   >> key.properties
          echo "storeFile=key.jks"     >> key.properties

      - name: Build release APK
        working-directory: simple_live_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
